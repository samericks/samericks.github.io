<section class="content-section" id="awards" aria-labelledby="awards-heading">
  <div class="section-heading"><h2 id="awards-heading">Honors &amp; awards</h2></div>
  <div class="section-body">
    {% for award in site.data.cv.awards %}
    <article class="cv-entry award-entry">
      <h3>{{ award.organization }}</h3>
      <div class="degree"><p>{{ award.description }}</p><p class="dates">{{ award.dates }}</p></div>
    </article>
    {% endfor %}
  </div>
</section>
